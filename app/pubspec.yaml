name: nova_vpn_app
description: NOVA VPN Android client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  http: ^1.2.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_v2ray_client:
    git:
      url: https://github.com/novavpnproxy/flutter_v2ray_client.git
      ref: a7efa90efcb314ac9953da76ca7e55e630d96de6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/nova_logo_new.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/nova_logo_new.jpg
  adaptive_icon_background: "#071020"
  adaptive_icon_foreground: assets/brand/nova_logo_new.jpg
